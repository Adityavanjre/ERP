<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klypso ERP | Loading...</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #0f172a;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: #2563eb;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.1), 0 10px 10px -5px rgba(37, 99, 235, 0.04);
            animation: pulse 2s infinite ease-in-out;
        }

        .logo-k {
            color: #ffffff;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin: 0 0 8px 0;
            color: #0f172a;
        }

        p {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .loader {
            margin-top: 32px;
            width: 200px;
            height: 4px;
            background-color: #f1f5f9;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar {
            position: absolute;
            height: 100%;
            width: 40%;
            background-color: #2563eb;
            border-radius: 2px;
            animation: slide 1.5s infinite ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.1); }
            50% { transform: scale(1.05); box-shadow: 0 30px 35px -5px rgba(37, 99, 235, 0.2); }
        }

        @keyframes slide {
            0% { left: -40%; }
            50% { left: 40%; }
            100% { left: 100%; }
        }

        .footer {
            position: absolute;
            bottom: 32px;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        * {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="logo-k">K</span>
        </div>
        <h1>Klypso ERP</h1>
        <p>Initializing Local Workspace</p>
        
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="footer">
        Powered by Klypso Native Engine
    </div>
</body>
</html>
