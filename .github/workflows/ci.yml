name: Nexus ERP CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          # Force workspace population to ensure local binary resolution
          npm install --include=dev --workspace=nexus/frontend --workspace=nexus/backend

      - name: Build Shared Contract
        run: npm run build -w @nexus/shared

      - name: Backend Quality Gates
        continue-on-error: true
        working-directory: nexus/backend
        run: |
          npm run lint
          npm run prisma:generate
          npm run build

      - name: Frontend Quality Gates
        working-directory: nexus/frontend
        run: |
          npm run lint
          SKIP_ENV_VALIDATION=1 npm run build

      - name: Security & Migration Audit
        run: |
          npm audit --audit-level=high || true
          if [ ! -z "$DATABASE_URL" ]; then
            npx prisma migrate status --schema=nexus/backend/prisma/schema.prisma
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-render:
    name: Trigger Render Deploy
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping deployment trigger."
            exit 0
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
