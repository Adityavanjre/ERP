name: Nexus ERP CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  # 1. Dependency & Cache Warmup
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit

  # 2. Shared Library Check
  check-shared:
    name: Shared Contract Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run build -w @nexus/shared

  # 3. Backend Quality Gates
  backend-lint:
    name: Backend Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run lint -w backend

  backend-build:
    name: Backend Build
    needs: [setup, check-shared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run build -w backend

  # 4. Frontend Quality Gates
  frontend-lint:
    name: Frontend Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run lint -w frontend

  frontend-build:
    name: Frontend Build
    needs: [setup, check-shared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run build -w frontend

  # 5. Security & Migration Audit
  security-audit:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - name: Dependency Audit (Critical/High)
        run: npm audit --audit-level=high
        continue-on-error: true

  migration-gate:
    name: Migration Safety
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - name: Verify Prisma Client
        run: npm run prisma:generate -w backend
      - name: Verify Migration Files
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping live migration check."
            exit 0
          fi
          npx prisma migrate status --schema=nexus/backend/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Final Success Gate
  all-gates-pass:
    name: All Gates Passed
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-build, frontend-lint, frontend-build, security-audit, migration-gate]
    steps:
      - run: echo "Nexus Monorepo ready for deployment."

  # 6. Formal Deployment Gate
  deploy-render:
    name: Trigger Render Deploy
    needs: all-gates-pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping deployment trigger."
            exit 0
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
